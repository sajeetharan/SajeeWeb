<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">DevGlobe production architecture</title>
  <desc id="desc">Public developer signals flow through ingestion into Azure Cosmos DB, then through Azure Functions, Blob Storage, Azure Container Apps, APIs, and MCP to humans and AI agents.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111d"/>
      <stop offset="1" stop-color="#0c2030"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4fd1e5"/>
    </marker>
    <style>
      .label{font:600 24px Inter,Arial,sans-serif;fill:#f8fafc}
      .small{font:500 17px Inter,Arial,sans-serif;fill:#94a3b8}
      .kicker{font:700 15px Inter,Arial,sans-serif;fill:#67e8f9;letter-spacing:2px}
      .node{fill:#102435;stroke:#29465c;stroke-width:2}
      .core{fill:#0b3040;stroke:#22d3ee;stroke-width:3}
      .flow{fill:none;stroke:#4fd1e5;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="820" rx="34" fill="url(#background)"/>
  <text x="70" y="74" class="kicker">DEVGLOBE · PRODUCTION ARCHITECTURE</text>
  <text x="70" y="122" class="label" style="font-size:34px">Evidence in. Bounded discovery out.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="210" width="270" height="220" rx="24" class="node"/>
    <text x="105" y="255" class="kicker">PUBLIC SIGNALS</text>
    <text x="105" y="307" class="label">GitHub</text>
    <text x="105" y="346" class="label">Stack Overflow</text>
    <text x="105" y="385" class="label">Community evidence</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="415" y="210" width="260" height="220" rx="24" class="node"/>
    <text x="450" y="255" class="kicker">DATA PIPELINE</text>
    <text x="450" y="307" class="label">Ingest</text>
    <text x="450" y="346" class="label">Enrich</text>
    <text x="450" y="385" class="label">Embed</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="750" y="180" width="310" height="280" rx="28" class="core"/>
    <text x="790" y="232" class="kicker">DATA + SEARCH + STATE</text>
    <text x="790" y="286" class="label" style="font-size:29px">Azure Cosmos DB</text>
    <text x="790" y="333" class="small">Developer profiles + embeddings</text>
    <text x="790" y="369" class="small">Activities + live presence</text>
    <text x="790" y="405" class="small">Consent + workflow state</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1135" y="160" width="200" height="130" rx="22" class="node"/>
    <text x="1165" y="205" class="kicker">PUBLIC READS</text>
    <text x="1165" y="252" class="label">Functions</text>

    <rect x="1135" y="330" width="200" height="130" rx="22" class="node"/>
    <text x="1165" y="375" class="kicker">SNAPSHOTS</text>
    <text x="1165" y="422" class="label">Blob Storage</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="750" y="560" width="310" height="160" rx="24" class="node"/>
    <text x="790" y="607" class="kicker">PRODUCT + PRIVATE ACTIONS</text>
    <text x="790" y="655" class="label">Azure Container Apps</text>
    <text x="790" y="690" class="small">Next.js · Auth · MCP · Mutations</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1135" y="560" width="200" height="160" rx="24" class="node"/>
    <text x="1165" y="607" class="kicker">EXPERIENCE</text>
    <text x="1165" y="655" class="label">Humans</text>
    <text x="1165" y="694" class="label">AI agents</text>
  </g>

  <path d="M340 320 H400" class="flow"/>
  <path d="M675 320 H735" class="flow"/>
  <path d="M1060 245 H1120" class="flow"/>
  <path d="M1060 390 H1120" class="flow"/>
  <path d="M905 460 V545" class="flow"/>
  <path d="M1060 640 H1120" class="flow"/>
  <path d="M1235 460 V545" class="flow"/>

  <text x="70" y="775" class="small">Text + vector search · TTL-backed presence · consent-gated introductions · machine-readable contracts</text>
</svg>
